# configs for funsearch


max_experiments: 820
samples_per_prompt: 4
num_islands: 10
functions_per_prompt: 2
reset_period: 100
keep_ratio: 0.5
cluster_sampling_temperature_init: 0.1
cluster_sampling_temperature_period: 80
use_signature_clustering: true
enable_test_eval: false